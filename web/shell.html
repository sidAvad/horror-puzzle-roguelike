<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Horror Puzzle Roguelike</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; align-items: center; padding-top: 8px; }
    #canvas { display: block; }

    #dpad {
      display: grid;
      grid-template-areas: ". up ." "left . right" ". down .";
      grid-template-columns: 70px 70px 70px;
      grid-template-rows: 70px 70px 70px;
      gap: 6px;
      margin-top: 12px;
    }
    .btn {
      background: rgba(80,80,80,0.85);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: white;
      -webkit-user-select: none; user-select: none;
      touch-action: manipulation;
      cursor: pointer;
    }
    .btn:active { background: rgba(140,140,140,0.9); }
    #btn-up    { grid-area: up; }
    #btn-down  { grid-area: down; }
    #btn-left  { grid-area: left; }
    #btn-right { grid-area: right; }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600" oncontextmenu="event.preventDefault()"></canvas>
  <p id="status" style="color:#666;font-family:monospace;font-size:12px;margin-top:4px;">Loading...</p>

  <div id="dpad">
    <div class="btn" id="btn-up">▲</div>
    <div class="btn" id="btn-left">◀</div>
    <div class="btn" id="btn-right">▶</div>
    <div class="btn" id="btn-down">▼</div>
  </div>

  <script>
    function fireKey(type, key, code, keyCode) {
      document.dispatchEvent(new KeyboardEvent(type, { key, code, keyCode, bubbles: true }));
    }

    const map = {
      'btn-up':    ['ArrowUp',    'ArrowUp',    38],
      'btn-down':  ['ArrowDown',  'ArrowDown',  40],
      'btn-left':  ['ArrowLeft',  'ArrowLeft',  37],
      'btn-right': ['ArrowRight', 'ArrowRight', 39],
    };

    Object.entries(map).forEach(([id, [key, code, keyCode]]) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => { e.preventDefault(); fireKey('keydown', key, code, keyCode); }, { passive: false });
      el.addEventListener('touchend',   e => { e.preventDefault(); fireKey('keyup',   key, code, keyCode); }, { passive: false });
    });
  </script>

  <script>
    function scaleCanvas() {
      var canvas = document.getElementById('canvas');
      var w = Math.min(window.innerWidth, 800);
      canvas.style.width  = w + 'px';
      canvas.style.height = (w * 600 / 800) + 'px';
    }
    window.addEventListener('resize', scaleCanvas);
    scaleCanvas();

    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function() {
        document.getElementById('status').textContent = 'Running';
        scaleCanvas();
      },
      print: function(t) { console.log(t); },
      printErr: function(t) {
        console.error(t);
        document.getElementById('status').textContent = 'Error: ' + t;
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
