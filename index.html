<!doctypehtml><html><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,user-scalable=no"name=viewport><title>Horror Puzzle Roguelike</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden}#canvas{display:block;max-width:100vw;max-height:70vh;object-fit:contain}#dpad{display:grid;grid-template-areas:". up ." "left . right" ". down .";grid-template-columns:70px 70px 70px;grid-template-rows:70px 70px 70px;gap:6px;margin-top:16px}.btn{background:rgba(80,80,80,.85);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}.btn:active{background:rgba(140,140,140,.9)}#btn-up{grid-area:up}#btn-down{grid-area:down}#btn-left{grid-area:left}#btn-right{grid-area:right}</style></head><body><canvas id=canvas oncontextmenu=event.preventDefault()></canvas><div id=dpad><div id=btn-up class=btn>▲</div><div id=btn-left class=btn>◀</div><div id=btn-right class=btn>▶</div><div id=btn-down class=btn>▼</div></div><script>function fireKey(e,t,r,n){document.dispatchEvent(new KeyboardEvent(e,{key:t,code:r,keyCode:n,bubbles:!0}))}const map={"btn-up":["ArrowUp","ArrowUp",38],"btn-down":["ArrowDown","ArrowDown",40],"btn-left":["ArrowLeft","ArrowLeft",37],"btn-right":["ArrowRight","ArrowRight",39]};Object.entries(map).forEach((([e,[t,r,n]])=>{const o=document.getElementById(e);o.addEventListener("touchstart",(e=>{e.preventDefault(),fireKey("keydown",t,r,n)}),{passive:!1}),o.addEventListener("touchend",(e=>{e.preventDefault(),fireKey("keyup",t,r,n)}),{passive:!1})}))</script><script async src=index.js></script></body></html>
